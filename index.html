<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps Point - Wilayah Indonesia</title>
     <link rel="icon" type="image/png" href="logo.png">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="logo-container">
            <img src="logo.png" alt="Maps Point" class="logo">
            <h1>Maps Point</h1>
        </div>
        
        <div class="stats">
            <div><i class="fas fa-location-dot"></i> Data: <span id="totalCount">0</span></div>
        </div>
    </div>

    <div class="main-container">
        <div id="map">
            <!-- Tombol Reset di dalam map -->
           <button id="resetMapBtn" class="map-reset-btn" title="Kembali ke tampilan awal">
    <i class="fas fa-sync-alt"></i>
    <span class="reset-text">Reset</span>
</button>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-list-ul"></i> Daftar Titik</h3>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari ID, provinsi, wilayah, kecamatan, desa...">
            </div>
            <div class="filter-box">
                <select id="provinsiFilter">
                    <option value="ALL">Semua Provinsi</option>
                </select>
            </div>
            <div class="locations-list" id="locationList">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Memuat data...
                </div>
            </div>
            <div class="footer-note">
                <i class="fas fa-info-circle"></i> Data dari <strong>Maps Point.json</strong>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
